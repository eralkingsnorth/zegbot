# Apache vhosts for Zegbot on wachatpilot.com subdomains
# Enable: sudo a2ensite zegbot.conf zegbot-api.conf && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName zegbot.wachatpilot.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3002/
    ProxyPassReverse / http://127.0.0.1:3002/

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3002/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/zegbot-web-error.log
    CustomLog ${APACHE_LOG_DIR}/zegbot-web-access.log combined
</VirtualHost>
